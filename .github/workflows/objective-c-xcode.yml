name: Xcode - Build and Analyze

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build and analyse default scheme using xcodebuild command
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo "$scheme_list" | ruby -e "require 'json'; data = JSON.parse(STDIN.read); candidates = data.dig('workspace', 'schemes') || data.dig('project', 'schemes') || data.dig('project', 'targets'); abort('No shared Xcode scheme or target found') if candidates.nil? || candidates.empty?; puts candidates[0]")
          echo "$default" | cat >default
          echo Using default scheme: "$default"
      - name: Build
        env:
          scheme: ${{ 'default' }}
        run: |
          if [ "$scheme" = default ]; then scheme=$(cat default); fi
          workspace_file=$(ls -A | grep -i '\.xcworkspace$' | head -n 1 || true)
          project_file=$(ls -A | grep -i '\.xcodeproj$' | head -n 1 || true)
          if [ -n "$workspace_file" ]; then
            filetype_parameter="workspace"
            file_to_build="$workspace_file"
          elif [ -n "$project_file" ]; then
            filetype_parameter="project"
            file_to_build="$project_file"
          else
            echo "No Xcode workspace or project found" >&2
            exit 1
          fi
          file_to_build=$(echo "$file_to_build" | awk '{$1=$1;print}')
          build_command=(xcodebuild clean build analyze -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)
          if command -v xcpretty >/dev/null 2>&1; then
            "${build_command[@]}" | xcpretty
            exit ${PIPESTATUS[0]}
          else
            "${build_command[@]}"
          fi

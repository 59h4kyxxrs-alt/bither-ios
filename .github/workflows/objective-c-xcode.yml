name: Xcode - Build and Analyze

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build and analyse default scheme using xcodebuild command
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(
            SCHEME_LIST="$scheme_list" ruby -e '
              require "json"

              data = JSON.parse(ENV.fetch("SCHEME_LIST"))
              scheme_or_target_names = data.dig("workspace", "schemes") ||
                data.dig("project", "schemes") ||
                data.dig("project", "targets")

              if scheme_or_target_names.nil? || scheme_or_target_names.empty?
                STDERR.puts("Error: No Xcode schemes or targets were found. Ensure the project has at least one scheme configured or a valid target.")
                exit(1)
              end

              puts scheme_or_target_names[0]
            '
          )
          echo "$default" | cat >default
          echo Using default scheme: "$default"
      - name: Build
        run: |
          scheme=$(cat default)
          shopt -s nullglob nocaseglob
          workspace_files=( *.xcworkspace )
          project_files=( *.xcodeproj )
          if [ ${#workspace_files[@]} -gt 0 ]; then
            filetype_parameter="workspace"
            file_to_build="${workspace_files[0]}"
          elif [ ${#project_files[@]} -gt 0 ]; then
            filetype_parameter="project"
            file_to_build="${project_files[0]}"
          else
            echo "No Xcode workspace or project found" >&2
            exit 1
          fi
          simulator_name=$(xcrun simctl list devices available | awk -F ' \\(' '/^[[:space:]]+(iPhone|iPad)/ {gsub(/^[[:space:]]+/, "", $1); print $1; exit}')
          if [ -z "$simulator_name" ]; then
            echo "No available iOS Simulator device found" >&2
            exit 1
          fi
          echo "Using simulator destination: $simulator_name"
          build_command=(
            xcodebuild
            clean
            build
            analyze
            -scheme "$scheme"
            -"$filetype_parameter" "$file_to_build"
            -sdk iphonesimulator
            -destination "platform=iOS Simulator,name=$simulator_name"
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
          )
          if command -v xcpretty >/dev/null 2>&1; then
            "${build_command[@]}" | xcpretty
            exit ${PIPESTATUS[0]}
          else
            "${build_command[@]}"
          fi
